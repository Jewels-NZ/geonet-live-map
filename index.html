<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live GeoNet All Earthquakes Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100%; width: 100%; z-index: 1; }
        #status {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 10px; border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="status">Updating in <span id="countdown">60</span>s...</div>
    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com"></script>
    <script>
        // Initialize the map centered on New Zealand
        const map = L.map('map').setView([-41.0, 174.0], 6);

        // Add map tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const quakeLayer = L.layerGroup().addTo(map);
        let countdown = 60;
        const countdownEl = document.getElementById('countdown');

        async function fetchQuakes() {
            try {
                const response = await fetch('https://geonet.org.nz');
                const data = await response.json();
                
                quakeLayer.clearLayers();

                data.features.forEach(quake => {
                    const mag = quake.properties.magnitude;
                    const coords = quake.geometry.coordinates; // [longitude, latitude, depth]
                    const time = new Date(quake.properties.time).toLocaleString('en-NZ');
                    const depth = quake.properties.depth.toFixed(1);
                    const locality = quake.properties.locality;

                    // Leaflet needs [Latitude, Longitude] -> coords[1] is Lat, coords[0] is Lng
                    const lat = coords[1];
                    const lng = coords[0];

                    // Don't map broken or missing coordinates
                    if (!lat || !lng) return;

                    const markerRadius = Math.max(mag * 3, 5);

                    const marker = L.circleMarker([lat, lng], {
                        radius: markerRadius,
                        fillColor: mag >= 5 ? '#ff0000' : mag >= 3 ? '#ff7800' : '#3388ff',
                        color: '#000',
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.7
                    });

                    marker.bindPopup(`
                        <strong>Magnitude: ${mag.toFixed(1)}</strong><br>
                        Location: ${locality}<br>
                        Depth: ${depth} km<br>
                        Time: ${time}
                    `);

                    quakeLayer.addLayer(marker);
                });
            } catch (error) {
                console.error("Error fetching GeoNet data:", error);
            }
        }

        // Countdown timer
        setInterval(() => {
            countdown--;
            countdownEl.textContent = countdown;
            if (countdown <= 0) {
                fetchQuakes();
                countdown = 60;
            }
        }, 1000);

        // Load immediately on page open
        fetchQuakes();
    </script>
</body>
</html>
