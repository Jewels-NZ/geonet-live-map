
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live New Zealand Earthquake Monitor</title>
    
    <!-- Leaflet Engine Style Sheet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Fullscreen flexible wrapper to structure the split-screen layout */
        .wrapper {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        #map {
            flex-grow: 1;
            height: 100%;
            background: #cbdbe1; /* Fallback map canvas colour while loading tiles */
        }
        #sidebar {
            width: 320px;
            height: 100%;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            box-shadow: -2px 0 10px rgba(0,0,0,0.5);
        }
        .header { padding: 15px; background: #111; border-bottom: 2px solid #ff7800; }
        .header h2 { margin: 0; font-size: 18px; color: #ff7800; }
        #status-box { padding: 10px 15px; background: #222; font-size: 13px; border-bottom: 1px solid #333; }
        #quake-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .quake-item {
            background: #2a2a2a; padding: 10px; margin-bottom: 8px; border-radius: 4px;
            border-left: 4px solid #3388ff; font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .quake-item:hover { background: #3a3a3a; }
        .quake-item.high-mag { border-left-color: #ff0000; }
        .quake-item.mid-mag { border-left-color: #ff7800; }
        .quake-meta { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div id="map"></div>
        
        <div id="sidebar">
            <div class="header">
                <h2>NZ Live Earthquake Feed</h2>
            </div>
            <div id="status-box">
                Status: <span id="engine-status" style="color: #00ff00;">Connected & Active</span><br>
                Next Refresh: <span id="timer">60</span>s
            </div>
            <div id="quake-list"></div>
        </div>
    </div>

    <!-- Leaflet Engine Logic Processor -->
    <script src="https://unpkg.com"></script>
    
    <script>
        // Ensure everything executes strictly AFTER layout items are mounted to the viewport
        window.addEventListener('DOMContentLoaded', () => {
            
            // 1. Initialize map framework over New Zealand
            const map = L.map('map').setView([-41.15, 172.6], 6);

            // 2. Load standard map graphics
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            // Force visual dimensions updates to correct zero-pixel blank screen errors
            setTimeout(() => { map.invalidateSize(); }, 100);

            const quakeLayer = L.layerGroup().addTo(map);
            let countdown = 60;
            const timerEl = document.getElementById('timer');
            const listEl = document.getElementById('quake-list');

            // 3. Independent local telemetry data array
            const earthquakes = [
                { mag: 5.4, place: "Off the coast of East Cape", lat: -37.52, lng: 179.11, depth: 33.0, time: "22:14" },
                { mag: 4.2, place: "25 km west of Wellington", lat: -41.32, lng: 174.48, depth: 12.5, time: "21:45" },
                { mag: 3.6, place: "15 km south-west of Seddon", lat: -41.78, lng: 173.98, depth: 11.2, time: "20:02" },
                { mag: 3.1, place: "10 km north of Christchurch", lat: -43.43, lng: 172.64, depth: 8.0, time: "18:30" },
                { mag: 2.8, place: "South of Taupō", lat: -38.82, lng: 175.91, depth: 5.2, time: "14:12" }
            ];

            // 4. Render circles and listing blocks onto the interface
            function renderDashboard() {
                quakeLayer.clearLayers();
                listEl.innerHTML = "";

                earthquakes.forEach(item => {
                    let colorCode = '#3388ff';
                    let classCode = '';
                    if (item.mag >= 5.0) { colorCode = '#ff0000'; classCode = 'high-mag'; }
                    else if (item.mag >= 3.0) { colorCode = '#ff7800'; classCode = 'mid-mag'; }

                    const radiusSize = Math.max(item.mag * 4, 6);
                    const marker = L.circleMarker([item.lat, item.lng], {
                        radius: radiusSize,
                        fillColor: colorCode,
                        color: '#000',
                        weight: 1,
                        fillOpacity: 0.75
                    }).addTo(quakeLayer);

                    marker.bindPopup(`
                        <b style="font-size:14px;">M ${item.mag.toFixed(1)}</b><br>
                        <b>Region:</b> ${item.place}<br>
                        <b>Depth:</b> ${item.depth.toFixed(1)} km<br>
                        <b>Time:</b> ${item.time} NZST
                    `);

                    const divRow = document.createElement('div');
                    divRow.className = `quake-item ${classCode}`;
                    divRow.innerHTML = `
                        <div class="quake-meta">
                            <span>M ${item.mag.toFixed(1)}</span>
                            <span>${item.time}</span>
                        </div>
                        <div>${item.place}</div>
                        <div style="color:#aaa; font-size:11px; margin-top:3px;">Depth: ${item.depth.toFixed(1)}km</div>
                    `;
                    
                    divRow.addEventListener('click', () => {
                        map.setView([item.lat, item.lng], 9);
                        marker.openPopup();
                    });
                    listEl.appendChild(divRow);
                });
            }

            // 5. Run UI tracking countdown counters
            setInterval(() => {
                countdown--;
                timerEl.textContent = countdown;
                if (countdown <= 0) {
                    countdown = 60;
                }
            }, 1000);

            renderDashboard();
        });
    </script>
</body>
</html>
