html<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live GeoNet Earthquake Monitor</title>
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; }
        #map { flex-grow: 1; height: 100%; z-index: 1; }
        #sidebar {
            width: 320px; height: 100%; background: #1a1a1a; color: #fff;
            display: flex; flex-direction: column; box-shadow: -2px 0 10px rgba(0,0,0,0.5); z-index: 10;
        }
        .header { padding: 15px; background: #111; border-bottom: 2px solid #ff7800; }
        .header h2 { margin: 0; font-size: 18px; color: #ff7800; }
        #status-box { padding: 10px 15px; background: #222; font-size: 13px; border-bottom: 1px solid #333; }
        #quake-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .quake-item {
            background: #2a2a2a; padding: 10px; margin-bottom: 8px; border-radius: 4px;
            border-left: 4px solid #3388ff; font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .quake-item:hover { background: #3a3a3a; }
        .quake-item.high-mag { border-left-color: #ff0000; }
        .quake-item.mid-mag { border-left-color: #ff7800; }
        .quake-meta { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div id="sidebar">
        <div class="header">
            <h2>GeoNet Live Feed</h2>
        </div>
        <div id="status-box">
            Status: <span id="engine-status" style="color: #ffea00;">Loading...</span><br>
            Next Refresh: <span id="timer">60</span>s
        </div>
        <div id="quake-list"></div>
    </div>

    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com"></script>
    <script>
        // Set up the map frame over New Zealand
        const map = L.map('map').setView([-41.15, 172.6], 6);

        // Load OpenStreetMap Base Tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const quakeLayer = L.layerGroup().addTo(map);
        let countdown = 60;
        const timerEl = document.getElementById('timer');
        const statusEl = document.getElementById('engine-status');
        const listEl = document.getElementById('quake-list');

        async function fetchEarthquakeData() {
            try {
                statusEl.textContent = "Fetching API...";
                statusEl.style.color = "#ffea00";

                // Pulling data with explicit API version header requirement
                const response = await fetch('https://geonet.org.nz', {
                    headers: { 'Accept': 'application/vnd.geo+json;version=2' }
                });

                if (!response.ok) throw new Error("HTTP " + response.status);

                const data = await response.json();
                
                // Safety clear
                quakeLayer.clearLayers();
                listEl.innerHTML = "";

                if (!data.features || data.features.length === 0) {
                    statusEl.textContent = "No Events Found";
                    return;
                }

                data.features.forEach(quake => {
                    const props = quake.properties;
                    const geom = quake.geometry;
                    if (!geom || !geom.coordinates) return;

                    const mag = props.magnitude;
                    const locality = props.locality;
                    const depth = props.depth;
                    const time = new Date(props.time).toLocaleTimeString('en-NZ', {hour: '2-digit', minute:'2-digit'});

                    // FIXED ARR INDEXING: index 0 is always Lng, index 1 is Lat
                    const lngValue = parseFloat(geom.coordinates[0]);
                    const latValue = parseFloat(geom.coordinates[1]);

                    if (isNaN(latValue) || isNaN(lngValue)) return;

                    // Set Color Weights
                    let colorCode = '#3388ff';
                    let classCode = '';
                    if (mag >= 5.0) { colorCode = '#ff0000'; classCode = 'high-mag'; }
                    else if (mag >= 3.0) { colorCode = '#ff7800'; classCode = 'mid-mag'; }

                    // Create Marker Circle
                    const radiusSize = Math.max(mag * 3.5, 6);
                    const marker = L.circleMarker([latValue, lngValue], {
                        radius: radiusSize,
                        fillColor: colorCode,
                        color: '#000',
                        weight: 1,
                        fillOpacity: 0.75
                    });

                    // Inside Marker Text Pop
                    marker.bindPopup(`
                        <b style="font-size:14px;">M ${mag.toFixed(1)}</b><br>
                        <b>Locality:</b> ${locality}<br>
                        <b>Depth:</b> ${depth.toFixed(1)} km<br>
                        <b>Time:</b> ${time}
                    `);
                    quakeLayer.addLayer(marker);

                    // Append to Sidebar List Element
                    const item = document.createElement('div');
                    item.className = `quake-item ${classCode}`;
                    item.innerHTML = `
                        <div class="quake-meta">
                            <span>M ${mag.toFixed(1)}</span>
                            <span>${time}</span>
                        </div>
                        <div>${locality}</div>
                        <div style="color:#aaa; font-size:11px; margin-top:3px;">Depth: ${depth.toFixed(1)}km</div>
                    `;
                    
                    // Clicking sidebar list snaps map to that quake location
                    item.addEventListener('click', () => {
                        map.setView([latValue, lngValue], 8);
                        marker.openPopup();
                    });
                    listEl.appendChild(item);
                });

                statusEl.textContent = "Connected & Active";
                statusEl.style.color = "#00ff00";

            } catch (err) {
                statusEl.textContent = "Error: " + err.message;
                statusEl.style.color = "#ff0000";
                console.error(err);
            }
        }

        // Keep counting down every second
        setInterval(() => {
            countdown--;
            timerEl.textContent = countdown;
            if (countdown <= 0) {
                fetchEarthquakeData();
                countdown = 60;
            }
        }, 1000);

        // Bootstrap on runtime
        fetchEarthquakeData();
    </script>
</body>
</html>
