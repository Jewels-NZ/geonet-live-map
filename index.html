<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live New Zealand Earthquake Monitor</title>
    
    <!-- Leaflet Engine Style Sheet Sheet -->
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <style>
        /* CRITICAL FIX: Explicit viewport settings to force the map to render visibly on the page */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
        }
        #map {
            flex-grow: 1;
            height: 100vh;
            width: 100%;
            z-index: 1;
        }
        #sidebar {
            width: 320px;
            height: 100vh;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            box-shadow: -2px 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .header { padding: 15px; background: #111; border-bottom: 2px solid #ff7800; }
        .header h2 { margin: 0; font-size: 18px; color: #ff7800; }
        #status-box { padding: 10px 15px; background: #222; font-size: 13px; border-bottom: 1px solid #333; }
        #quake-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .quake-item {
            background: #2a2a2a; padding: 10px; margin-bottom: 8px; border-radius: 4px;
            border-left: 4px solid #3388ff; font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .quake-item:hover { background: #3a3a3a; }
        .quake-item.high-mag { border-left-color: #ff0000; }
        .quake-item.mid-mag { border-left-color: #ff7800; }
        .quake-meta { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div id="sidebar">
        <div class="header">
            <h2>NZ Live Earthquake Feed</h2>
        </div>
        <div id="status-box">
            Status: <span id="engine-status" style="color: #ffea00;">Loading...</span><br>
            Next Refresh: <span id="timer">60</span>s
        </div>
        <div id="quake-list"></div>
    </div>

    <!-- Leaflet Engine Logic Processor -->
    <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // Set up map viewpoint canvas frame over the center of New Zealand
        const map = L.map('map').setView([-41.15, 172.6], 6);

        // Populate base tracking grid using OpenStreetMap tile references
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const quakeLayer = L.layerGroup().addTo(map);
        let countdown = 60;
        const timerEl = document.getElementById('timer');
        const statusEl = document.getElementById('engine-status');
        const listEl = document.getElementById('quake-list');

        async function fetchEarthquakeData() {
            try {
                statusEl.textContent = "Updating map...";
                statusEl.style.color = "#ffea00";

                // Query the reliable USGS open data sync mirror endpoint
                const globalFeedUrl = 'https://usgs.gov';
                const response = await fetch(globalFeedUrl);
                if (!response.ok) throw new Error("Connection failed");

                const data = await response.json();
                
                quakeLayer.clearLayers();
                listEl.innerHTML = "";

                let localizedCount = 0;

                data.features.forEach(quake => {
                    const props = quake.properties;
                    const geom = quake.geometry;
                    if (!geom || !geom.coordinates) return;

                    // Pull location records out using programmatic array offset mapping
                    const locationDataArray = geom.coordinates;
                    const lngValue = parseFloat(locationDataArray[0]);
                    const latValue = parseFloat(locationDataArray[1]);
                    const depth = parseFloat(locationDataArray[2]);
                    const mag = props.mag;

                    // Bound checks to isolate New Zealand tracking space specifically
                    if (latValue < -48 || latValue > -34 || lngValue < 164 || lngValue > 179) return;
                    
                    localizedCount++;

                    // Format regional timestamps
                    const time = new Date(props.time).toLocaleTimeString('en-NZ', {hour: '2-digit', minute:'2-digit'});
                    const locality = props.place;

                    let colorCode = '#3388ff';
                    let classCode = '';
                    if (mag >= 5.0) { colorCode = '#ff0000'; classCode = 'high-mag'; }
                    else if (mag >= 3.0) { colorCode = '#ff7800'; classCode = 'mid-mag'; }

                    const radiusSize = Math.max(mag * 3.5, 6);
                    const marker = L.circleMarker([latValue, lngValue], {
                        radius: radiusSize,
                        fillColor: colorCode,
                        color: '#000',
                        weight: 1,
                        fillOpacity: 0.75
                    });

                    marker.bindPopup(`
                        <b style="font-size:14px;">M ${mag.toFixed(1)}</b><br>
                        <b>Region:</b> ${locality}<br>
                        <b>Depth:</b> ${depth.toFixed(1)} km<br>
                        <b>Time:</b> ${time}
                    `);
                    quakeLayer.addLayer(marker);

                    // Inject tracking block rows to dashboard sidebar
                    const item = document.createElement('div');
                    item.className = `quake-item ${classCode}`;
                    item.innerHTML = `
                        <div class="quake-meta">
                            <span>M ${mag.toFixed(1)}</span>
                            <span>${time}</span>
                        </div>
                        <div>${locality}</div>
                        <div style="color:#aaa; font-size:11px; margin-top:3px;">Depth: ${depth.toFixed(1)}km</div>
                    `;
                    
                    item.addEventListener('click', () => {
                        map.setView([latValue, lngValue], 9);
                        marker.openPopup();
                    });
                    listEl.appendChild(item);
                });

                if (localizedCount === 0) {
                    statusEl.textContent = "Quiet (No quakes today)";
                    statusEl.style.color = "#00ff00";
                } else {
                    statusEl.textContent = "Connected & Active";
                    statusEl.style.color = "#00ff00";
                }

            } catch (err) {
                statusEl.textContent = "Sync Offline";
                statusEl.style.color = "#ff0000";
                console.error(err);
            }
        }

        // Initialize background network execution cycles
        setInterval(() => {
            countdown--;
            timerEl.textContent = countdown;
            if (countdown <= 0) {
                fetchEarthquakeData();
                countdown = 60;
            }
        }, 1000);

        fetchEarthquakeData();
    </script>
</body>
</html>
