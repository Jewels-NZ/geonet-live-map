
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live New Zealand Earthquake Monitor</title>
    
    <!-- Leaflet Engine Style Sheet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
        }
        #map {
            flex-grow: 1;
            height: 100vh;
            width: 100%;
            z-index: 1;
        }
        #sidebar {
            width: 320px;
            height: 100vh;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            box-shadow: -2px 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .header { padding: 15px; background: #111; border-bottom: 2px solid #ff7800; }
        .header h2 { margin: 0; font-size: 18px; color: #ff7800; }
        #status-box { padding: 10px 15px; background: #222; font-size: 13px; border-bottom: 1px solid #333; }
        #quake-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .quake-item {
            background: #2a2a2a; padding: 10px; margin-bottom: 8px; border-radius: 4px;
            border-left: 4px solid #3388ff; font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .quake-item:hover { background: #3a3a3a; }
        .quake-item.high-mag { border-left-color: #ff0000; }
        .quake-item.mid-mag { border-left-color: #ff7800; }
        .quake-meta { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div id="sidebar">
        <div class="header">
            <h2>NZ Live Earthquake Feed</h2>
        </div>
        <div id="status-box">
            Status: <span id="engine-status" style="color: #ffea00;">Loading...</span><br>
            Next Refresh: <span id="timer">60</span>s
        </div>
        <div id="quake-list"></div>
    </div>

    <!-- Leaflet Engine Logic Processor -->
    <script src="https://unpkg.com"></script>
    
    <script>
        // Set up map viewpoint canvas frame over New Zealand
        const map = L.map('map').setView([-41.15, 172.6], 6);

        // Populate base tracking layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const quakeLayer = L.layerGroup().addTo(map);
        let countdown = 60;
        const timerEl = document.getElementById('timer');
        const statusEl = document.getElementById('engine-status');
        const listEl = document.getElementById('quake-list');

        // HARDCODED BACKUP DATA SET
        const backupQuakes = [
            { mag: 4.2, place: "25 km west of Wellington", lat: -41.32, lng: 174.48, depth: 12.5, time: "Recent (Backup)" },
            { mag: 3.1, place: "10 km north of Christchurch", lat: -43.43, lng: 172.64, depth: 8.0, time: "Recent (Backup)" },
            { mag: 5.4, place: "Off the coast of East Cape", lat: -37.52, lng: 179.11, depth: 33.0, time: "Recent (Backup)" },
            { mag: 2.8, place: "South of Taupō", lat: -38.82, lng: 175.91, depth: 5.2, time: "Recent (Backup)" }
        ];

        function processAndRenderMarkers(featuresList, isUsingLiveAPI) {
            quakeLayer.clearLayers();
            listEl.innerHTML = "";

            featuresList.forEach(item => {
                let mag, locality, latValue, lngValue, depth, timeString;

                if (isUsingLiveAPI) {
                    // FIXED: Using array duplicate shifting methods to bypass the code stripping glitch entirely
                    const coords = Array.from(item.geometry.coordinates);
                    lngValue = parseFloat(coords.shift());
                    latValue = parseFloat(coords.shift());
                    depth = parseFloat(coords.shift());
                    
                    mag = parseFloat(item.properties.mag);
                    locality = item.properties.place;
                    timeString = new Date(item.properties.time).toLocaleTimeString('en-NZ', {hour: '2-digit', minute:'2-digit'});

                    // Bounds configuration mapping filter
                    if (latValue < -48 || latValue > -34 || lngValue < 164 || lngValue > 179) return;
                } else {
                    mag = item.mag;
                    locality = item.place;
                    latValue = item.lat;
                    lngValue = item.lng;
                    depth = item.depth;
                    timeString = item.time;
                }

                let colorCode = '#3388ff';
                let classCode = '';
                if (mag >= 5.0) { colorCode = '#ff0000'; classCode = 'high-mag'; }
                else if (mag >= 3.0) { colorCode = '#ff7800'; classCode = 'mid-mag'; }

                const radiusSize = Math.max(mag * 4, 6);
                const marker = L.circleMarker([latValue, lngValue], {
                    radius: radiusSize,
                    fillColor: colorCode,
                    color: '#000',
                    weight: 1,
                    fillOpacity: 0.75
                });

                marker.bindPopup(`
                    <b style="font-size:14px;">M ${mag.toFixed(1)}</b><br>
                    <b>Region:</b> ${locality}<br>
                    <b>Depth:</b> ${depth.toFixed(1)} km<br>
                    <b>Time:</b> ${timeString}
                `);
                quakeLayer.addLayer(marker);

                const divRow = document.createElement('div');
                divRow.className = `quake-item ${classCode}`;
                divRow.innerHTML = `
                    <div class="quake-meta">
                        <span>M ${mag.toFixed(1)}</span>
                        <span>${timeString}</span>
                    </div>
                    <div>${locality}</div>
                    <div style="color:#aaa; font-size:11px; margin-top:3px;">Depth: ${depth.toFixed(1)}km</div>
                `;
                
                divRow.addEventListener('click', () => {
                    map.setView([latValue, lngValue], 9);
                    marker.openPopup();
                });
                listEl.appendChild(divRow);
            });
        }

        async function fetchEarthquakeData() {
            try {
                statusEl.textContent = "Syncing Live Feed...";
                statusEl.style.color = "#ffea00";

                const response = await fetch('https://usgs.gov');
                if (!response.ok) throw new Error("API Offline");

                const data = await response.json();
                processAndRenderMarkers(data.features, true);

                statusEl.textContent = "Connected & Active";
                statusEl.style.color = "#00ff00";

            } catch (err) {
                console.warn("API restricted. Switching to fallback mode.", err);
                processAndRenderMarkers(backupQuakes, false);
                statusEl.textContent = "Active (Demo Mode)";
                statusEl.style.color = "#ffaa00";
            }
        }

        // Timer loops
        setInterval(() => {
            countdown--;
            timerEl.textContent = countdown;
            if (countdown <= 0) {
                fetchEarthquakeData();
                countdown = 60;
            }
        }, 1000);

        fetchEarthquakeData();
    </script>
</body>
</html>
